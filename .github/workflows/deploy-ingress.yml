name: deploy-ingress

on:
  workflow_dispatch:
  push:
    branches:
      - staging
    paths:
      - "kubernetes/ingress.yaml"

concurrency:
  group: deploy-ingress-staging
  cancel-in-progress: false

jobs:
  deploy-ingress:
    name: Deploy Ingress Only
    runs-on: ubuntu-latest
    environment: Staging
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_LOCATION: ${{ secrets.GCP_LOCATION }}
      GKE_CLUSTER_NAME: ${{ secrets.GKE_CLUSTER_NAME }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME }}
      NAMESPACE_NAME: ${{ vars.NAMESPACE_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: ${{ env.GKE_CLUSTER_NAME }}
          location: ${{ env.GCP_LOCATION }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Install envsubst
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base

      - name: Ensure Namespace
        run: |
          kubectl create namespace "$NAMESPACE_NAME" --dry-run=client -o yaml | kubectl apply -f -

      - name: Render Ingress Manifest
        run: |
          mkdir -p rendered
          envsubst < kubernetes/ingress.yaml > rendered/ingress.yaml

      - name: Apply Ingress
        run: |
          kubectl apply -f rendered/ingress.yaml
